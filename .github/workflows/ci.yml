name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (core only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff

      - name: Zero-dependency core check
        run: >
          python -c "import tfguard, tfguard.cli, tfguard.hcl, tfguard.loader, tfguard.rules, tfguard.analyze, tfguard.sarif, tfguard.render, tfguard.demo;
          print('core imports with no third-party package')"

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: pytest -q

      - name: Console scripts work from a base install
        run: |
          tfguard --help
          tfguard rules | head -3
          tfguard explain TFG001

      - name: Demo end to end
        # `shell: bash` is not cosmetic: windows-latest defaults to pwsh, where
        # `if cmd; then` is a ParserError ("Missing '(' after 'if' in if statement").
        shell: bash
        run: |
          tfguard demo --dir demo-workspace
          if tfguard scan demo-workspace --fail-on critical; then
            echo "expected a non-zero exit: the demo workspace is deliberately hostile"
            exit 1
          fi
          echo "gate correctly blocked the demo workspace"

      - name: A hardened workspace passes the high gate
        shell: bash
        run: |
          mkdir -p clean
          cat > clean/versions.tf <<'TF'
          terraform {
            required_version = ">= 1.5"
            backend "s3" {
              bucket  = "company-tfstate"
              key     = "prod/terraform.tfstate"
              encrypt = true
            }
            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "~> 5.0"
              }
            }
          }
          TF
          cat > clean/s3.tf <<'TF'
          resource "aws_s3_bucket" "logs" {
            bucket = "company-logs"
            server_side_encryption_configuration {
              rule {
                apply_server_side_encryption_by_default {
                  sse_algorithm = "aws:kms"
                }
              }
            }
            versioning {
              enabled = true
            }
            logging {
              target_bucket = "company-audit"
            }
          }
          TF
          cat > clean/sg.tf <<'TF'
          resource "aws_security_group" "app" {
            name = "app"
            egress = []
            ingress {
              from_port   = 443
              to_port     = 443
              cidr_blocks = ["10.0.0.0/8"]
            }
          }
          TF
          cat > clean/db.tf <<'TF'
          resource "aws_db_instance" "main" {
            identifier            = "main"
            engine                = "postgres"
            storage_encrypted     = true
            publicly_accessible   = false
            vpc_security_group_ids = [aws_security_group.app.id]
          }
          TF
          cat > clean/vpc.tf <<'TF'
          resource "aws_vpc" "main" {
            cidr_block = "10.0.0.0/16"
          }
          resource "aws_flow_log" "main" {
            vpc_id = aws_vpc.main.id
          }
          TF
          tfguard scan clean --fail-on high

      - name: SARIF output is valid
        run: |
          tfguard scan demo-workspace --format sarif --output results.sarif
          # encoding is explicit: on the Windows runner open() defaults to
          # cp1252 and the SARIF carries non-ASCII rule text
          python -c "import json; d=json.load(open('results.sarif', encoding='utf-8')); assert d['version']=='2.1.0' and d['runs'][0]['results']; print('sarif ok')"

      - name: MCP manifest
        run: |
          python -m pip install -e ".[mcp]"
          python -c "
          import asyncio
          from tfguard.mcp_server import build_server, tool_manifest
          names = [t['name'] for t in tool_manifest()]
          assert all(t['description'] for t in tool_manifest())
          tools = asyncio.run(build_server().list_tools())
          print(f'{len(names)} tools:', ', '.join(sorted(names)))
          assert len(tools) == len(names)
          "

  # TFG060 (no remote backend) and TFG061 (remote backend that is not
  # encrypted) cannot both fire in one workspace, so the demo ships its
  # backend in its own file and this job deletes it to exercise the other.
  demo-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - name: Every rule that can fire in the demo does
        run: |
          tfguard demo --dir demo-workspace --format json > demo.json
          python - <<'PY'
          import json
          from tfguard.rules import RULES

          data = json.load(open("demo.json", encoding="utf-8"))
          fired = {f["rule"] for f in data["findings"]}
          expected = [r.id for r in RULES if r.id != "TFG060"]
          missing = [r for r in expected if r not in fired]
          print(f"{len(fired)} rules fired, {len(expected)} expected")
          assert not missing, f"the demo does not exercise {missing}"
          PY
      - name: Removing the backend surfaces the other rule
        run: |
          rm demo-workspace/state.tf
          tfguard scan demo-workspace --format json > nobackend.json
          python - <<'PY'
          import json

          data = json.load(open("nobackend.json", encoding="utf-8"))
          fired = {f["rule"] for f in data["findings"]}
          assert "TFG060" in fired, "no-backend rule missing"
          assert "TFG061" not in fired, "the backend rule fired without a backend"
          print("TFG060 fires without a backend, TFG061 does not")
          PY

  # A visitor who clones this repo types `pytest`. With a src/ layout that only
  # works if something puts src/ on sys.path, and CI would never notice because
  # it installs the package first.
  fresh-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: pytest works with nothing installed
        run: pytest -q --collect-only

  # The README test badge is the first number a visitor reads; assert it
  # against pytest so it cannot drift silently.
  badge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[mcp]" pytest
      - name: README test-count badge vs pytest
        run: |
          collected=$(python -m pytest --collect-only -q -o addopts= 2>/dev/null | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+' || true)
          badge=$(grep -oE 'tests-[0-9]+%20passing' README.md | head -1 | grep -oE '[0-9]+' || true)
          echo "collected=${collected:-NOTHING} badge=${badge:-NONE}"
          if [ -z "$collected" ]; then
            echo "::warning::pytest collected nothing - the badge check did not run"
          elif [ "$collected" != "$badge" ]; then
            echo "::warning::README badge says $badge but pytest collects $collected"
          fi
