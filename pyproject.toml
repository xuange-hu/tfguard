[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfguard"
version = "0.1.0"
description = "Terraform / OpenTofu configuration audit: 40 rules over an HCL2 parser written from scratch, credential tracing and cross-block relationships. Zero dependencies, SARIF, MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xuange-hu" }]
keywords = ["terraform", "opentofu", "hcl", "iac", "security", "devsecops", "sarif", "mcp", "cloud"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2,<3"]

[project.urls]
Homepage = "https://github.com/xuange-hu/tfguard"
Source = "https://github.com/xuange-hu/tfguard"

[project.scripts]
tfguard = "tfguard.cli:main"
tfguard-mcp = "tfguard.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
